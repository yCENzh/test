name: Baseline compare

# Diagnostic only, not part of the normal gate. Runs the specs that failed on the
# work branch against an unmodified checkout, on the same runner image, so the
# result says which failures the branch introduced and which were already there.
#
# The visual snapshot specs are excluded on purpose:
# `tests/site/visual.spec.ts-snapshots/` is gitignored (.gitignore:66), so the
# snapshots exist in no checkout and those tests can never pass here.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Unmodified main, same specs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # 48df663, not main. `main` predates the integration-driven generation, so
      # its dev server cannot resolve `@/generated/local-icon-collections` and
      # every comparison fails before a test runs. 48df663 is this branch as it
      # stood before any of this work, which makes the two runs comparable.
      - uses: actions/checkout@v4
        with:
          repository: yCENzh/Shirone
          ref: 48df66350818a57c2df85611bc6b7d6874fc70d5
          path: theme

      # Version comes from the checkout under test: the work branch declares
      # pnpm 11 and this baseline declares pnpm 9, so a shared literal would
      # install the wrong one for half the comparison.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: theme/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: theme
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: theme
        run: pnpm exec playwright install --with-deps chrome

      - name: The specs that failed on the work branch
        working-directory: theme
        env:
          SHARP_CONCURRENCY: 2
        run: |
          pnpm exec playwright test --reporter=line \
            tests/site/math.spec.ts \
            tests/site/last-updated-notice.spec.ts \
            tests/site/archive-grouping.spec.ts \
            tests/site/archive-filter.spec.ts \
            tests/site/projects.spec.ts \
            tests/site/taxonomy.spec.ts \
            tests/site/steps.spec.ts \
            tests/site/mdx.spec.ts