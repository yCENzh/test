name: Verify Shirone work branch

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-shirone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast gate ──────────────────────────────────────────────────────────────
  # Everything that reads source only. Fails in ~2 min, so a broken manifest or
  # a stale test import surfaces without waiting on a build or the e2e suite.
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: yCENzh/Shirone
          ref: work
          path: theme

      # `package_json_file` rather than a literal: the action only looks for
      # `packageManager` in the working directory, which here is the test repo
      # root and has none. A literal would hide a mismatch between the declared
      # version and the one that runs.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: theme/package.json

      # No `cache: pnpm`. setup-node resolves the store by running
      # `pnpm store path` in the working directory, whose pnpm-workspace.yaml has
      # no `packages` field, so pnpm exits 1 before any theme code runs.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: theme
        run: pnpm install --frozen-lockfile

      - name: Assert the declared packageManager is what runs
        working-directory: theme
        run: |
          set -euo pipefail
          declared=$(node -p "require('./package.json').packageManager.split('@')[1]")
          actual=$(pnpm --version)
          echo "declared=$declared actual=$actual"
          test "$declared" = "$actual" \
            || { echo "::error::packageManager says $declared but pnpm $actual is running"; exit 1; }

      - name: astro check
        working-directory: theme
        run: pnpm check

      - name: Atom, markdown and skills manifests
        working-directory: theme
        run: pnpm check:manifest

      - name: Package dependency manifest
        working-directory: theme
        run: pnpm check:package-manifest

      - name: Design lint
        working-directory: theme
        run: pnpm design:lint

      # `--isolatedDeclarations` errors in motion.ts / meting.ts / setting-utils.ts
      # predate this work and also fail on unmodified main. Separate step so the
      # failure is attributed instead of masking the rest.
      - name: type-check (known failing)
        working-directory: theme
        continue-on-error: true
        run: pnpm type-check

      # After Install on purpose: `thumbnails/generate.ts` imports sharp at module
      # scope. A local run hides this because node_modules is always present.
      - name: Content pipeline validation
        working-directory: theme
        continue-on-error: true
        run: pnpm content:validate

      # Dry run only. `--yes` deletes tracked files, so the two regenerate() calls
      # that now take functions instead of script paths are only reached on the
      # real run. The same functions are covered by the build job below.
      - name: Content clean (dry run)
        working-directory: theme
        run: node scripts/content/clean.mjs

  # ── Build gate ──────────────────────────────────────────────────────────────
  # Independent of `checks`: both only need the checkout and an install, so they
  # run at the same time instead of one waiting on the other.
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: yCENzh/Shirone
          ref: work
          path: theme

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: theme/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: theme
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: theme
        env:
          # 77 images through sharp exceed the default heap at full concurrency.
          SHARP_CONCURRENCY: 2
        run: pnpm build

      # Proves the artefacts come from the integration rather than a build-time
      # script: no script chain step exists any more, so their presence can only
      # mean `astro:config:setup` / `buildStart` produced them.
      - name: Assert the integration generated the artefacts
        working-directory: theme
        run: |
          set -euo pipefail
          test -s src/generated/local-icon-collections.ts \
            || { echo "::error::icon collection missing"; exit 1; }
          count=$(find public/assets/moments/thumbnails -name '*.webp' | wc -l)
          echo "thumbnails: $count"
          test "$count" -gt 0 \
            || { echo "::error::no thumbnails generated"; exit 1; }
          echo "artefacts generated by the integration, not the script chain"

  # ── End-to-end ──────────────────────────────────────────────────────────────
  # `playwright.config.ts` sets workers: 1, so 422 specs run serially in one
  # worker and a single runner needs ~40 min. Sharding across runners keeps each
  # one serial — preserving whatever ordering the suite depends on — while
  # splitting the file list, so the wall clock is roughly the slowest shard.
  e2e:
    name: Playwright (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/5", "2/5", "3/5", "4/5", "5/5"]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: yCENzh/Shirone
          ref: work
          path: theme

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: theme/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: theme
        run: pnpm install --frozen-lockfile

      # The suite's own config asks for `channel: chrome`. Install that channel
      # rather than overriding the project list — `--project=chromium` fails
      # because the config defines no such project.
      - name: Install Playwright browsers
        working-directory: theme
        run: pnpm exec playwright install --with-deps chrome

      # No manual server. `playwright.config.ts` declares a `webServer` that runs
      # `astro dev`, and 18 specs import theme source through `page.evaluate`
      # (/src/utils/…, /src/config/…) to reach behaviour a built bundle cannot
      # expose. Starting `astro preview` instead fails those with "Failed to
      # fetch dynamically imported module".
      # `visual.spec.ts` is excluded by listing the files rather than by editing
      # playwright.config.ts: its snapshots live in
      # `tests/site/visual.spec.ts-snapshots/`, which .gitignore:66 keeps out of
      # every checkout, so `toHaveScreenshot` can never pass on CI. The whole file
      # is one test and every assertion in it is a snapshot comparison. Visual
      # review stays a local job — AGENTS.md already describes snapshots as local
      # baselines that are updated only after a human confirms the difference.
      - name: Playwright
        working-directory: theme
        env:
          SHARP_CONCURRENCY: 2
        run: |
          mapfile -t specs < <(ls tests/site/*.spec.ts | grep -v 'visual\.spec\.ts$')
          pnpm exec playwright test --reporter=line --shard=${{ matrix.shard }} "${specs[@]}"